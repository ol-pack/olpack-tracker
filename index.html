<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ol Pack — Учёт заказов</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-muted: #f5f5f5;
    --text-primary: #111111;
    --text-secondary: #555555;
    --text-tertiary: #888888;
    --text-quaternary: #aaaaaa;
    --border: #e0e0e0;
    --accent-blue: #2563eb;
    --accent-red: #dc2626;
    --accent-green: #16a34a;
    --accent-purple: #7c3aed;
    --accent-orange: #ea580c;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f;
      --bg-muted: #1a1a1a;
      --text-primary: #f0f0f0;
      --text-secondary: #b0b0b0;
      --text-tertiary: #808080;
      --text-quaternary: #606060;
      --border: #2a2a2a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    padding: 20px;
    max-width: 960px;
    margin: 0 auto;
    line-height: 1.5;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.3px; }
  .subtitle { font-size: 13px; color: var(--text-tertiary); margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat { padding: 14px; border-radius: 10px; border: 1px solid var(--border); text-align: center; background: var(--bg); }
  .stat-val { font-size: 22px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 11px; color: var(--text-quaternary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; background: var(--bg); }
  .card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
  .form-grid { display: grid; grid-template-columns: 1.2fr 1.5fr 0.8fr 1fr auto; gap: 8px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--text-quaternary); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 500; }
  .field input, .field select { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; }
  .field input:focus, .field select:focus { border-color: var(--text-primary); }
  .btn { padding: 9px 18px; border-radius: 8px; border: none; background: var(--text-primary); color: var(--bg); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.15s; white-space: nowrap; }
  .btn:hover { opacity: 0.85; }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--bg-muted); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; font-size: 13px; color: var(--text-secondary); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .filter-btn:hover { background: var(--bg-muted); color: var(--text-primary); }
  .filter-btn.active { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }
  .search { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font-size: 14px; width: 220px; font-family: inherit; outline: none; }
  .search:focus { border-color: var(--text-primary); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 8px; color: var(--text-quaternary); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  td { padding: 10px 8px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--bg-muted); }
  .sum { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .status { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; user-select: none; transition: transform 0.1s; }
  .status:active { transform: scale(0.95); }
  .status-new { background: rgba(37,99,235,0.1); color: var(--accent-blue); }
  .status-work { background: rgba(234,88,12,0.1); color: var(--accent-orange); }
  .status-ready { background: rgba(124,58,237,0.1); color: var(--accent-purple); }
  .status-sent { background: rgba(22,163,74,0.1); color: var(--accent-green); }
  .status-done { background: rgba(22,163,74,0.15); color: var(--accent-green); }
  .status-cancel { background: rgba(220,38,38,0.1); color: var(--accent-red); }
  .actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  tr:hover .actions { opacity: 1; }
  .icon-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-secondary); font-family: inherit; padding: 0; }
  .icon-btn:hover { background: var(--bg-muted); color: var(--text-primary); }
  .edit-row td { padding: 6px 8px; background: var(--bg-muted) !important; }
  .edit-row input, .edit-row select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text-primary); font-size: 13px; font-family: inherit; width: 100%; outline: none; }
  .edit-row input:focus, .edit-row select:focus { border-color: var(--text-primary); }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 14px; }
  .hint { font-size: 12px; color: var(--text-quaternary); margin-top: 8px; }
  .export-bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  @media (max-width: 700px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .field:last-child { grid-column: 1 / -1; }
    .form-grid .btn { width: 100%; }
    .toolbar { flex-direction: column; align-items: stretch; gap: 10px; }
    .search { width: 100%; }
    .actions { opacity: 1; }
    th, td { padding: 8px 4px; font-size: 12px; }
  }
</style>
</head>
<body>

<h1>Ol Pack — Учёт заказов</h1>
<div class="subtitle">Семейное производство круглых коробок</div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="stTotal">0</div><div class="stat-label">Всего заказов</div></div>
  <div class="stat"><div class="stat-val" id="stSum">0 ₽</div><div class="stat-label">Общая сумма</div></div>
  <div class="stat"><div class="stat-val" id="stActive">0</div><div class="stat-label">В работе</div></div>
  <div class="stat"><div class="stat-val" id="stDone">0</div><div class="stat-label">Выполнено</div></div>
</div>

<div class="card">
  <div class="card-title">Новый заказ</div>
  <div class="form-grid">
    <div class="field"><label>Клиент</label><input type="text" id="inClient" placeholder="Имя или компания"></div>
    <div class="field"><label>Товар</label><input type="text" id="inProduct" placeholder="Напр: Шайба D18 × 50 шт"></div>
    <div class="field"><label>Сумма, ₽</label><input type="number" id="inSum" placeholder="0"></div>
    <div class="field"><label>Статус</label>
      <select id="inStatus">
        <option value="new">Новый</option>
        <option value="work">В работе</option>
        <option value="ready">Готов</option>
        <option value="sent">Отправлен</option>
        <option value="done">Доставлен</option>
        <option value="cancel">Отменён</option>
      </select>
    </div>
    <button class="btn" onclick="addOrder()">Добавить</button>
  </div>
  <div class="hint">Данные сохраняются автоматически в браузере. Закрепите эту страницу в закладках или на рабочем столе.</div>
</div>

<div class="card">
  <div class="toolbar">
    <div class="filters" id="filterBox"></div>
    <input type="text" class="search" id="inSearch" placeholder="Поиск по клиенту или товару..." oninput="render()">
  </div>
  <div id="tableBox"></div>
  <div class="export-bar">
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 Скачать CSV</button>
    <button class="btn btn-ghost btn-sm" onclick="clearAll()">🗑 Очистить всё</button>
  </div>
</div>

<script>
const KEY = 'olpack_orders_v2';
const LABELS = {
  new: 'Новый', work: 'В работе', ready: 'Готов',
  sent: 'Отправлен', done: 'Доставлен', cancel: 'Отменён'
};
const CLASSES = {
  new: 'status-new', work: 'status-work', ready: 'status-ready',
  sent: 'status-sent', done: 'status-done', cancel: 'status-cancel'
};
const FLOW = ['new','work','ready','sent','done','cancel'];

let orders = [];
let filter = 'all';
let editing = null;

try {
  const raw = localStorage.getItem(KEY);
  if (raw) orders = JSON.parse(raw);
} catch(e) {}

if (!orders.length) {
  orders = [
    { id: 1, client: 'Анна (Н. Новгород)', product: 'Шайба D16 × 60 шт', sum: 3900, status: 'done', date: '2026-07-10' },
    { id: 2, client: 'Екатерина (Казань)', product: 'Шайба D18 пудра × 200 шт', sum: 15600, status: 'done', date: '2026-07-12' },
    { id: 3, client: 'Марина (Тула)', product: 'Классика D21 × 70 шт', sum: 5950, status: 'work', date: '2026-07-15' },
    { id: 4, client: 'Алексей (Екатеринбург)', product: 'Шайба D18 × 80 шт', sum: 6400, status: 'ready', date: '2026-07-16' },
    { id: 5, client: 'Ольга (Самара)', product: 'Аквашайба 30×20 × 15 шт', sum: 6750, status: 'new', date: '2026-07-18' }
  ];
  save();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(orders)); } catch(e) {}
  render();
}

function addOrder() {
  var client = document.getElementById('inClient').value.trim();
  var product = document.getElementById('inProduct').value.trim();
  var sum = parseInt(document.getElementById('inSum').value) || 0;
  var status = document.getElementById('inStatus').value;
  if (!client || !product) { alert('Укажите клиента и товар'); return; }
  var id = orders.length ? Math.max.apply(null, orders.map(function(o){ return o.id; })) + 1 : 1;
  orders.unshift({ id: id, client: client, product: product, sum: sum, status: status, date: new Date().toISOString().slice(0,10) });
  document.getElementById('inClient').value = '';
  document.getElementById('inProduct').value = '';
  document.getElementById('inSum').value = '';
  document.getElementById('inStatus').value = 'new';
  save();
}

function del(id) {
  if (!confirm('Удалить заказ №' + id + '?')) return;
  orders = orders.filter(function(o){ return o.id !== id; });
  save();
}

function editStart(id) { editing = id; render(); }
function editCancel() { editing = null; render(); }
function editSave(id) {
  var row = document.querySelector('[data-eid="' + id + '"]');
  if (!row) return;
  var inputs = row.querySelectorAll('input, select');
  var o = orders.find(function(x){ return x.id === id; });
  if (!o) return;
  o.client = inputs[0].value.trim();
  o.product = inputs[1].value.trim();
  o.sum = parseInt(inputs[2].value) || 0;
  o.status = inputs[3].value;
  editing = null;
  save();
}

function cycleStatus(id) {
  var o = orders.find(function(x){ return x.id === id; });
  if (!o) return;
  var i = FLOW.indexOf(o.status);
  o.status = FLOW[(i + 1) % FLOW.length];
  save();
}

function setFilter(f) { filter = f; render(); }

function exportCSV() {
  var csv = '\uFEFFID;Дата;Клиент;Товар;Сумма;Статус\n';
  orders.forEach(function(o) {
    csv += [o.id, o.date, '"' + o.client + '"', '"' + o.product + '"', o.sum, LABELS[o.status]].join(';') + '\n';
  });
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'olpack_orders_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

function clearAll() {
  if (!confirm('Удалить ВСЕ заказы? Это необратимо.')) return;
  orders = [];
  save();
}

function render() {
  var q = document.getElementById('inSearch').value.toLowerCase();
  var list = orders.filter(function(o) {
    if (filter !== 'all' && o.status !== filter) return false;
    if (q && !o.client.toLowerCase().includes(q) && !o.product.toLowerCase().includes(q)) return false;
    return true;
  });

  var totalSum = orders.reduce(function(s, o){ return s + (o.status !== 'cancel' ? o.sum : 0); }, 0);
  document.getElementById('stTotal').textContent = orders.length;
  document.getElementById('stSum').textContent = totalSum.toLocaleString('ru-RU') + ' ₽';
  document.getElementById('stActive').textContent = orders.filter(function(o){ return ['new','work','ready','sent'].indexOf(o.status) !== -1; }).length;
  document.getElementById('stDone').textContent = orders.filter(function(o){ return o.status === 'done'; }).length;

  var counts = {};
  orders.forEach(function(o){ counts[o.status] = (counts[o.status] || 0) + 1; });
  var fb = '<button class="filter-btn ' + (filter === 'all' ? 'active' : '') + '" onclick="setFilter(\'all\')">Все (' + orders.length + ')</button>';
  FLOW.forEach(function(st) {
    fb += '<button class="filter-btn ' + (filter === st ? 'active' : '') + '" onclick="setFilter(\'' + st + '\')">' + LABELS[st] + ' (' + (counts[st] || 0) + ')</button>';
  });
  document.getElementById('filterBox').innerHTML = fb;

  var box = document.getElementById('tableBox');
  if (!list.length) { box.innerHTML = '<div class="empty">Нет заказов по выбранному фильтру</div>'; return; }

  var html = '<table><thead><tr><th>№</th><th>Дата</th><th>Клиент</th><th>Товар</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody>';
  list.forEach(function(o) {
    if (editing === o.id) {
      html += '<tr class="edit-row" data-eid="' + o.id + '">' +
        '<td>' + o.id + '</td>' +
        '<td>' + o.date.slice(5) + '</td>' +
        '<td><input value="' + o.client.replace(/"/g, '&quot;') + '"></td>' +
        '<td><input value="' + o.product.replace(/"/g, '&quot;') + '"></td>' +
        '<td><input type="number" value="' + o.sum + '"></td>' +
        '<td><select>' + FLOW.map(function(s){ return '<option value="' + s + '"' + (s === o.status ? ' selected' : '') + '>' + LABELS[s] + '</option>'; }).join('') + '</select></td>' +
        '<td><div class="actions" style="opacity:1"><button class="icon-btn" onclick="editSave(' + o.id + ')" title="Сохранить">✓</button><button class="icon-btn" onclick="editCancel()" title="Отмена">✕</button></div></td>' +
        '</tr>';
    } else {
      html += '<tr>' +
        '<td>' + o.id + '</td>' +
        '<td>' + o.date.slice(5) + '</td>' +
        '<td>' + o.client + '</td>' +
        '<td>' + o.product + '</td>' +
        '<td class="sum">' + o.sum.toLocaleString('ru-RU') + ' ₽</td>' +
        '<td><span class="status ' + CLASSES[o.status] + '" onclick="cycleStatus(' + o.id + ')" title="Кликни для смены">' + LABELS[o.status] + '</span></td>' +
        '<td><div class="actions"><button class="icon-btn" onclick="editStart(' + o.id + ')" title="Редактировать">✎</button><button class="icon-btn" onclick="del(' + o.id + ')" title="Удалить">🗑</button></div></td>' +
        '</tr>';
    }
  });
  html += '</tbody></table>';
  box.innerHTML = html;
}

render();
</script>

</body>
</html>
